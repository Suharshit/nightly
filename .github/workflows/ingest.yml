name: nightly-ingest

# 20:30 UTC = 02:00 IST. Fetch boards, then the free rules extraction, then the Groq pass
# for whatever the rules left (resumable: anything over the daily quota waits for tomorrow).
# Embedding is added here once embed.py lands.

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EXTRACT_MODEL: openai/gpt-oss-20b
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is not set"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - run: python -m worker.ingest
      - run: python -m worker.extract --backend rules
      - name: LLM pass (Groq)
        if: env.GROQ_API_KEY != ''
        run: python -m worker.extract --backend groq --limit 300
