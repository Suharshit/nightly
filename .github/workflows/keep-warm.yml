name: keep-warm

# The free Hugging Face Space sleeps when idle, and waking it takes a minute or more, so the
# first visitor would wait. Ping /health every 30 minutes from 08:00 to 00:00 IST
# (02:30-18:30 UTC), when Indian students use the app. GitHub may run scheduled jobs late.
on:
  schedule:
    - cron: "0,30 3-18 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:

# Least privilege: the built-in GITHUB_TOKEN can only read the repo.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          # A sleeping Space can take a few minutes to answer; retry instead of failing at once.
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 60 https://suharshit-nightly-api.hf.space/health; then
              echo; echo "awake"; exit 0
            fi
            sleep 20
          done
          echo "::warning::The API did not answer /health"; exit 1
