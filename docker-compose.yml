services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nightly
      POSTGRES_PASSWORD: nightly
      POSTGRES_DB: nightly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/local/000_auth_stub.sql:/docker-entrypoint-initdb.d/000_auth_stub.sql:ro
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/migrations/002_extraction_source.sql:/docker-entrypoint-initdb.d/002_extraction_source.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightly"]
      interval: 3s
      retries: 20
  # api and worker services are added once those slices exist (Thu/Sat).

volumes:
  pgdata:
